name: CI

# Every gate below FAILS THE BUILD. A gate that is not enforced is not a gate;
# it is a hope. See CLAUDE.md §4.8 and prompts/02-toolchain-and-dependencies.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — NOT the default shallow clone. The frozen-tests guard below
      # diffs the working tree against freeze shas (ac06e70, c30e784) for provenance;
      # in a depth-1 clone those commits are unreachable and the step fails for a reason
      # unrelated to any test. The hash check works shallow; the provenance check does not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # CON-10: the project installs on a clean machine from the lock file alone.
      # `npm ci` fails if package.json and package-lock.json disagree.
      - name: Install (clean, from lock)
        run: npm ci

      # NFR-MNT-04
      - name: Typecheck
        run: npm run typecheck

      # NFR-MNT-04
      - name: Lint
        run: npm run lint

      # FR-SCH-05 purity guard, manifest level: engine and shared declare zero
      # runtime dependencies. An engine that cannot import anything cannot
      # import a clock.
      #
      # The import-level half of this guard is the no-restricted-imports rule
      # scoped to engine/** in .eslintrc.cjs, enforced by the Lint step above.
      # Both are needed: npm hoists to the root node_modules, so a stray
      # `import 'mongodb'` inside engine/ resolves at runtime even when
      # engine/package.json declares nothing.
      - name: Engine purity guard (FR-SCH-05)
        run: npm run guard:engine-deps

      # FR-SCH-05 / CON-04, ambient-global level: the engine reaches no clock, RNG,
      # timer, network or process global. This is the only FR-SCH-05 guard that sees a
      # call needing no import and no dependency (Date.now(), Math.random(), fetch()...),
      # which the deps guard and the lint override both miss by construction.
      - name: Engine ambient-purity guard (FR-SCH-05)
        run: npm run guard:engine-purity

      # FR-RSC-03 / NFR-MNT-03: exactly one function produces placements
      # (findCandidateSlots, engine/src), re-invoked by both the manual and automatic
      # paths. Guards the most exposed requirement in the repo against a second, local
      # placement helper being added while every test stays green.
      - name: Single placement function guard (FR-RSC-03)
        run: npm run guard:single-placement

      # RED/GREEN boundary (CLAUDE.md §8.3): frozen test suites may not change. Added
      # after this workflow was first written; enforced until now only when a human
      # remembered to run `verify` locally. Requires fetch-depth: 0 above for its
      # provenance diff against the freeze shas.
      - name: Frozen-tests guard (RED/GREEN boundary)
        run: npm run guard:tests-frozen

      # NFR-MNT-01 (Essential): engine coverage >= 90% lines, enforced as a
      # coverageThreshold in jest.config.cjs.
      - name: Test + coverage
        run: npm run test:coverage
